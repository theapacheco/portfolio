<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Résumé — Austin Pacheco</title>
    <meta name="description" content="Austin Pacheco — full résumé, work experience, education, certifications, and contact." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('reelcut-theme') ||
            (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,480;1,9..144,420&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav id="site-nav"></nav>
    <div class="page-head">
      <h1>Résumé</h1>
      <p id="resume-subtitle"></p>
    </div>
    <main>
      <!-- Contact info bar -->
      <section id="resume-contact" style="border-top:none;"></section>

      <!-- Experience -->
      <section id="resume-experience">
        <div class="section-head">
          <h2>Experience</h2>
        </div>
        <div id="experience-list"></div>
      </section>

      <!-- Education -->
      <section id="resume-education">
        <div class="section-head">
          <h2>Education</h2>
        </div>
        <div id="education-list"></div>
      </section>

      <!-- Skills -->
      <section id="resume-skills">
        <div class="section-head">
          <h2>Tools & Skills</h2>
        </div>
        <ul class="skills-list" id="skills-list"></ul>
      </section>

      <!-- Certifications -->
      <section id="resume-certs">
        <div class="section-head">
          <h2>Certifications</h2>
        </div>
        <ul class="skills-list" id="certs-list"></ul>
      </section>

      <!-- Credits -->
      <section id="resume-credits">
        <div class="section-head">
          <h2>Credits</h2>
          <span class="slate">SELECTED FILMOGRAPHY</span>
        </div>
        <div class="edl" id="credits-list"></div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/resume.ts"></script>
  </body>
</html>
