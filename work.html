<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work — Austin Pacheco</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('reelcut-theme') ||
            (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,480;1,9..144,420&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav id="site-nav"></nav>
    <div class="page-head">
      <h1>Work</h1>
      <p>Selected projects across disciplines.</p>
    </div>
    <main>
      <section style="border-top:none;" id="section-editing">
        <div class="section-head">
          <h2>Editing</h2>
          <span class="slate" id="count-editing"></span>
        </div>
        <div class="reel-grid" id="grid-editing"></div>
      </section>

      <section id="section-writing">
        <div class="section-head">
          <h2>Writing</h2>
          <span class="slate" id="count-writing"></span>
        </div>
        <div class="reel-grid" id="grid-writing"></div>
      </section>

      <section id="section-lighting">
        <div class="section-head">
          <h2>Lighting</h2>
          <span class="slate" id="count-lighting"></span>
        </div>
        <div class="reel-grid" id="grid-lighting"></div>
      </section>

      <section id="section-camera">
        <div class="section-head">
          <h2>Camera & Photos</h2>
          <span class="slate" id="count-camera"></span>
        </div>
        <div class="reel-grid" id="grid-camera"></div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/src/pages/work.ts"></script>
  </body>
</html>
